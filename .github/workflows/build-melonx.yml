# Optional GitHub Actions build. Not executed or uploaded by Codex.
# Put this at .github/workflows/build-melonx.yml in a small build repository.
# Put melonx-device-motion.patch and verify-motion.py at that repository's root.
name: Build MeloNX device motion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Read build files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get the inspected MeloNX revision and apply the patch
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://starforgejo.dev/projects/MeloNX
          git -C source fetch --depth 1 origin 13700519f3abc4e6d7ed8a065b118b2cc59bcd67
          git -C source checkout --detach FETCH_HEAD
          git -C source apply --check "$GITHUB_WORKSPACE/melonx-device-motion.patch"
          git -C source apply "$GITHUB_WORKSPACE/melonx-device-motion.patch"

      - name: Install the repository's .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: source/global.json

      - name: Check toolchain and motion logic
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          dotnet --info
          python3 verify-motion.py source

      # Must run AFTER verify-motion.py: that script runs `git diff --check` and
      # requires that only Swift/xcstrings files differ from the base commit.
      #
      # The pinned upstream revision needs Ryujinx.LibHac 0.21.0-alpha.129, which
      # only ever lived on a custom feed that no longer serves it (nuget.org's
      # newest copy is 0.20.0). This step downloads that exact package, checks its
      # SHA-256, and points NuGet at a local folder feed.
      #
      # Fallback: if every download fails, put the same .nupkg in this repository
      # at vendor/Ryujinx.LibHac.0.21.0-alpha.129.nupkg (it is hash-checked too).
      - name: Provide Ryujinx.LibHac from a verified local feed
        working-directory: source
        shell: bash
        env:
          LIBHAC_VERSION: "0.21.0-alpha.129"
          # SHA-256 of the .nupkg, taken from an independent package manifest
          # (Nix deps file, sha256-vwpjCsMZayUAzaydzcO9ktEzNIYEmDpQbhswGx8O7no=).
          LIBHAC_SHA256: "bf0a630ac3196b2500cdac9dcdc3bd92d133348604983a506e1b301b1f0eee7a"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          version = os.environ["LIBHAC_VERSION"]
          expected = os.environ["LIBHAC_SHA256"].lower()
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          feed = pathlib.Path(os.environ["RUNNER_TEMP"]) / "libhac-feed"
          feed.mkdir(parents=True, exist_ok=True)
          target = feed / f"Ryujinx.LibHac.{version}.nupkg"

          # 1. The version the repository actually asks for must be the one we vouch for.
          pinned = None
          for node in ET.parse("Directory.Packages.props").getroot().iter():
              if node.get("Include") == "Ryujinx.LibHac":
                  pinned = node.get("Version") or node.get("VersionOverride")
          print("Pinned Ryujinx.LibHac version:", pinned)
          if pinned != version:
              sys.exit(f"Repository pins {pinned!r}, this workflow was written for {version!r}. "
                       "Update LIBHAC_VERSION and LIBHAC_SHA256 together.")

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def accept(path, origin):
              actual = sha256(path)
              print(f"  {origin}: sha256 {actual}")
              if actual == expected:
                  return True
              print("  -> hash mismatch, rejected")
              return False

          candidates = [
              workspace / "vendor" / f"Ryujinx.LibHac.{version}.nupkg",
          ]
          urls = [
              f"https://git.ryujinx.app/api/packages/projects/nuget/package/ryujinx.libhac/{version}/ryujinx.libhac.{version}.nupkg",
              f"https://legacy.git.ryujinx.app/api/v4/projects/17/packages/nuget/download/ryujinx.libhac/{version}/ryujinx.libhac.{version}.nupkg",
          ]

          ok = False
          for path in candidates:
              if path.is_file():
                  print("Trying local file", path)
                  if accept(path, str(path)):
                      target.write_bytes(path.read_bytes())
                      ok = True
                      break
          if not ok:
              for url in urls:
                  print("Downloading", url)
                  result = subprocess.run(
                      ["curl", "--fail", "--location", "--silent", "--show-error",
                       "--retry", "3", "--connect-timeout", "20", "--max-time", "180",
                       "--output", str(target), url])
                  if result.returncode == 0 and target.is_file() and accept(target, url):
                      ok = True
                      break
                  target.unlink(missing_ok=True)
          if not ok:
              sys.exit("Could not obtain a hash-verified Ryujinx.LibHac "
                       f"{version}. Add it as vendor/Ryujinx.LibHac.{version}.nupkg "
                       "in the build repository, or build LibHac from source.")
          print("Verified package ready:", target)

          # 2. Repoint NuGet: drop the dead feed, add the local feed for this one package.
          cfg = next(p for p in pathlib.Path(".").iterdir() if p.name.lower() == "nuget.config")
          print("--- nuget.config before ---")
          print(cfg.read_text(encoding="utf-8-sig"))
          tree = ET.parse(cfg)
          root = tree.getroot()
          for sources in root.iter("packageSources"):
              for node in list(sources):
                  if node.tag == "add" and node.get("key") == "LibHacAlpha":
                      sources.remove(node)
              ET.SubElement(sources, "add", key="LocalLibHac", value=str(feed))
          for mapping in root.iter("packageSourceMapping"):
              for node in list(mapping):
                  if node.get("key") == "LibHacAlpha":
                      mapping.remove(node)
              local = ET.SubElement(mapping, "packageSource", key="LocalLibHac")
              ET.SubElement(local, "package", pattern="Ryujinx.LibHac")
          tree.write(cfg, encoding="utf-8", xml_declaration=True)
          print("--- nuget.config after ---")
          print(cfg.read_text(encoding="utf-8"))
          PY

      - name: Build using the repository's Xcode scheme and its .NET build target
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MeloNXDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package an unsigned IPA for later signing
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/MeloNXDerivedData/Build/Products/Release-iphoneos/MeloNX.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/MeloNXPackage/Payload"
          ditto "$app" "$RUNNER_TEMP/MeloNXPackage/Payload/MeloNX.app"
          cd "$RUNNER_TEMP/MeloNXPackage"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/MeloNX-device-motion-unsigned.ipa" Payload

      - name: Save the unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: MeloNX-device-motion-unsigned
          path: MeloNX-device-motion-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Save the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MeloNX-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
